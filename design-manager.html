-rgb: 140 196 255;\n  --hero-mid-rgb: 78 155 245;\n  --surface-light-rgb: 209 213 220;\n  --on-light-rgb: 48 61 80;\n  --scrollbar-thumb: 213 28% 22%;\n  --scrollbar-hover: 213 28% 30%;\n\n  /* 字体：思源黑体 Source Han Sans CN（已内嵌 woff2 分片，见 assets/fonts） */\n  --font-sans: 'Source Han Sans CN', 'Source Han Sans SC', 'Noto Sans SC', 'PingFang SC',\n    'HarmonyOS Sans SC', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: 'SF Mono', 'JetBrains Mono', 'Cascadia Mono', Consolas, 'Liberation Mono',\n    'Source Han Sans CN', 'Source Han Sans SC', 'Noto Sans SC', ui-monospace, monospace;\n\n  /* 动效 token（design.md §6） */\n  --d-stagger: 40ms;\n  --d-micro: 80ms;\n  --d-quick: 150ms;\n  --d-fast: 250ms;\n  --d-medium: 350ms;\n  --d-slow: 400ms;\n  --d-very-slow: 500ms;\n  --d-archive-cover: 900ms;\n  --d-image-hover: 700ms;\n  --d-experiment-cover: 1200ms;\n  --d-reveal: 650ms;\n  --d-tool-reveal: 560ms;\n  --d-tool-stagger: 60ms;\n  --d-detail-reveal: 700ms;\n  --d-section-reveal: 900ms;\n  --d-route: 550ms;\n  --d-entry: 800ms;\n  --d-hover: 200ms;\n  --d-ui: 300ms;\n  --d-role: 450ms;\n  --loop-scroll: 1.6s;\n  --loop-float: 11s;\n  --loop-shimmer: 2.4s;\n  --loop-grid: 24s;\n  --loop-pulse: 2.6s;\n  --loop-marquee: 32s;\n\n  --e-feedback: cubic-bezier(0.16, 1, 0.3, 1);\n  --e-smooth: cubic-bezier(0.22, 1, 0.36, 1);\n  --e-standard: cubic-bezier(0.4, 0, 0.2, 1);\n  --e-decelerate: cubic-bezier(0, 0, 0.2, 1);\n  --e-button: cubic-bezier(0.215, 0.61, 0.355, 1);\n  --e-io: ease-in-out;\n  --e-out: ease-out;\n  --e-linear: linear;\n  --e-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n  --e-morph: cubic-bezier(0.32, 1.25, 0.4, 1);\n\n  /* 品牌渐变（蓝色调）：浅蓝 → 主蓝 #2686ED → 深蓝，仅用于描边 / 光带 / 进度条 */\n  --grad-accent: linear-gradient(120deg, rgb(var(--accent-strong-rgb)) 0%, var(--brand) 48%, rgb(var(--accent-deep-rgb)) 100%);\n\n  --radius-rect: 12px;\n  --nav-h: 64px;\n  --container-home: 1536px;\n  --container-hero: 1400px;\n  --container-page: 1380px;\n  --gutter-home: 64px;\n  --section-space: 128px;\n\n  /* Editable component and responsive parameters. */\n  --gutter-home-tablet: 40px;\n  --gutter-home-mobile: 20px;\n  --heading-index-min: 56px;\n  --heading-index-fluid: 5vw;\n  --heading-index-max: 84px;\n  --heading-en-min: 36px;\n  --heading-en-fluid: 4vw;\n  --heading-en-max: 58px;\n  --heading-title-min: 26px;\n  --heading-title-fluid: 2.4vw;\n  --heading-title-max: 36px;\n  --heading-gap: 16px;\n  --heading-gap-mobile: 14px;\n  --heading-row-gap: 16px;\n  --heading-row-gap-mobile: 12px;\n  --heading-copy-top: 34px;\n  --heading-copy-top-mobile: 28px;\n  --heading-en-left: -28px;\n  --heading-en-left-mobile: -20px;\n  --heading-en-top: -3px;\n  --heading-en-opacity: .12;\n  --heading-min-height: 88px;\n  --heading-min-height-mobile: 72px;\n  --heading-title-weight: 600;\n  --heading-title-line: 1.3;\n  --heading-title-tracking: -.03em;\n  --heading-index-tracking: -.06em;\n  --heading-en-tracking: .04em;\n  --heading-slash-size: 30px;\n  --badge-font-size: 14px;\n  --badge-padding-y: 6px;\n  --badge-padding-x: 16px;\n  --badge-gap: 8px;\n  --badge-dot-size: 6px;\n  --badge-tracking: .08em;\n  --work-tag-height: 32px;\n  --work-tag-radius: 4px;\n  --work-tag-font-size: 14px;\n  --work-tag-padding-x: 16px;\n  --work-tag-bg-alpha: .08;\n  --work-tag-hover-alpha: .15;\n  --surface-card-radius: 8px;\n  --surface-card-padding: 12px;\n  --surface-card-gap: 12px;\n  --surface-card-bg-alpha: .04;\n  --surface-card-hover-alpha: .08;\n  --surface-card-border-alpha: .1;\n  --surface-card-border-hover-alpha: .25;\n  --button-padding-x: 18px;\n  --button-padding-y: 10px;\n  --button-icon-size: 20px;\n  --button-gap: 12px;\n  --button-min-height: 56px;\n  --button-font-size: 14px;\n  --button-border-alpha: .2;\n  --button-radius: var(--radius-rect);\n  --profile-name-size: 28px;\n  --profile-position-gap: 12px;\n  --profile-position-size: 16px;\n  --profile-row-gap: 32px;\n  --footer-content-width: 1024px;\n  --footer-title-gap: 24px;\n  --footer-description-gap: 16px;\n  --footer-nav-gap: 28px;\n  --footer-channels-gap: 48px;\n  --footer-copyright-gap: 64px;\n  --footer-value-size: 16px;\n  --footer-nav-size: 13px;\n  --pointer-glow-edge-radius: 280px;\n  --pointer-glow-fill-radius: 230px;\n  --pointer-glow-fill-alpha: .12;\n  --pointer-glow-fill-max: .5;\n}\n/* DESIGN-MANAGER:END */\n"</script><script id="seed-preview" type="application/json">"@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\n/* ============================================================\n   深空蓝黑 · 磨砂玻璃 / 全局样式基座\n   层次：Token → 基础 → 玻璃材质 → 组件类 → 动效 → 降级\n   规则来源：design.md（冲突时以 design.md 为准）\n   ============================================================ */\n\n/* ---------- 1. Design Tokens ---------- */\n/* Tokens are loaded directly from public/design-system.css by index.html. */\n\n/* ---------- 2. 基础 ---------- */\n@layer base {\n  * {\n    -webkit-tap-highlight-color: transparent;\n  }\n\n  html {\n    scroll-behavior: smooth;\n    scroll-padding-top: 96px;\n  }\n\n  body {\n    background-color: hsl(var(--bg));\n    color: hsl(var(--text));\n    font-family: var(--font-sans);\n    font-weight: 400;\n    -webkit-font-smoothing: antialiased;\n    -moz-osx-font-smoothing: grayscale;\n    text-rendering: optimizeLegibility;\n    /* clip 而不是 hidden：hidden 会把 overflow-y 计算成 auto，\n       body 变成第二个滚动容器，页面上会出现两条竖向滚动条 */\n    overflow-x: clip;\n  }\n\n  ::selection {\n    background: rgb(var(--accent) / 0.28);\n    color: hsl(var(--text));\n  }\n\n  :focus-visible {\n    outline: 2px solid var(--brand);\n    outline-offset: 2px;\n    border-radius: var(--radius-rect);\n  }\n\n  ::-webkit-scrollbar {\n    width: 10px;\n    height: 10px;\n  }\n  ::-webkit-scrollbar-track {\n    background: hsl(var(--bg));\n  }\n  ::-webkit-scrollbar-thumb {\n    background: hsl(var(--scrollbar-thumb));\n    border-radius: 999px;\n    border: 2px solid hsl(var(--bg));\n  }\n  ::-webkit-scrollbar-thumb:hover {\n    background: hsl(var(--scrollbar-hover));\n  }\n}\n\n/* ---------- 3. 玻璃材质 + 组件类 ---------- */\n@layer components {\n  /* --- 玻璃三档（design.md §4） --- */\n  .glass-sm,\n  .glass,\n  .glass-lg {\n    position: relative;\n    background: linear-gradient(135deg, rgb(var(--paper-rgb) / 0.06), rgb(var(--paper-rgb) / 0.02));\n    backdrop-filter: blur(16px) saturate(160%);\n    -webkit-backdrop-filter: blur(16px) saturate(160%);\n    border: 1px solid rgb(var(--paper-rgb) / 0.1);\n    box-shadow: inset 0 1px 0 rgb(var(--paper-rgb) / 0.12), 0 24px 60px -24px rgb(var(--ink-rgb) / 0.75);\n  }\n  .glass-sm {\n    backdrop-filter: blur(12px) saturate(150%);\n    -webkit-backdrop-filter: blur(12px) saturate(150%);\n    box-shadow: inset 0 1px 0 rgb(var(--paper-rgb) / 0.1), 0 12px 32px -18px rgb(var(--ink-rgb) / 0.7);\n  }\n  .glass-lg {\n    background: linear-gradient(135deg, rgb(var(--paper-rgb) / 0.075), rgb(var(--paper-rgb) / 0.025));\n    backdrop-filter: blur(24px) saturate(170%);\n    -webkit-backdrop-filter: blur(24px) saturate(170%);\n    box-shadow: inset 0 1px 0 rgb(var(--paper-rgb) / 0.14), 0 40px 90px -30px rgb(var(--ink-rgb) / 0.8);\n  }\n\n  /* 玻璃「活过来」：仅边框亮起 + 内高光增强，不加外发光 */\n  .glass-hover {\n    transition: border-color var(--d-fast) var(--e-smooth),\n      box-shadow var(--d-fast) var(--e-smooth), transform var(--d-fast) var(--e-smooth);\n  }\n  .glass-hover:hover,\n  .glass-hover:focus-visible {\n    border-color: rgb(var(--accent) / 0.45);\n    box-shadow: inset 0 1px 0 rgb(var(--paper-rgb) / 0.22),\n      inset 0 0 0 1px rgb(var(--accent) / 0.12), 0 30px 70px -26px rgb(var(--ink-rgb) / 0.8);\n  }\n\n  /* --- 小标签 / 胶囊 --- */\n  .chip {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--badge-gap);\n    border-radius: 9999px;\n    padding: var(--badge-padding-y) var(--badge-padding-x);\n    font-family: var(--font-sans);\n    font-size: var(--badge-font-size);\n    line-height: 1.5;\n    letter-spacing: var(--badge-tracking);\n    text-transform: none;\n    color: var(--muted);\n    background: rgb(var(--paper-rgb) / 0.08);\n    border: 1px solid rgb(var(--paper-rgb) / 0.2);\n  }\n\n  .badge-dot { width: var(--badge-dot-size); height: var(--badge-dot-size); }\n\n  .chip--image { background: rgb(var(--ink-rgb) / .7); }\n\n  .chip[aria-pressed=\"true\"] {\n    color: var(--brand);\n    background: rgb(var(--brand-rgb) / .12);\n    border-color: transparent;\n  }\n\n  /* Reference accent here is dark, not our blue brand: fade the resting edge out.\n     Keep 1px transparent border geometry and use background-opacity feedback only. */\n  @media (hover: hover) and (pointer: fine) {\n    .chip {\n      transition: background-color var(--d-hover) var(--e-feedback),\n        border-color var(--d-hover) var(--e-feedback);\n    }\n    .chip:hover {\n      background: rgb(var(--paper-rgb) / 0.15);\n      border-color: transparent;\n    }\n    .chip--image:hover { background: rgb(var(--ink-rgb) / .78); }\n    .chip[aria-pressed=\"true\"]:hover {\n      background: rgb(var(--brand-rgb) / .16);\n    }\n  }\n\n  /* --- 排版基元（design.md §3） --- */\n  .type-display {\n    font-size: clamp(2.6rem, 7vw, 6rem);\n    line-height: 1.02;\n    letter-spacing: -0.02em;\n    font-weight: 700;\n  }\n  .type-h2 {\n    font-size: clamp(1.9rem, 3.6vw, 3.1rem);\n    line-height: 1.1;\n    letter-spacing: -0.01em;\n    font-weight: 650;\n  }\n  .type-h3 {\n    font-size: 1.25rem;\n    line-height: 1.35;\n    font-weight: 600;\n  }\n  .type-body {\n    font-size: 1rem;\n    line-height: 1.75;\n    color: var(--muted);\n  }\n  .type-label {\n    font-family: var(--font-mono);\n    font-size: 0.6875rem;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .type-num {\n    font-family: var(--font-mono);\n    font-variant-numeric: tabular-nums;\n  }\n  .text-gradient {\n    background: var(--grad-accent);\n    -webkit-background-clip: text;\n    background-clip: text;\n    color: transparent;\n  }\n\n  /* --- 光
